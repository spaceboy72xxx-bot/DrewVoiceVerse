<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Text to Speech — DrewVoiceVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

    <div class="container">
        <a href="index.html" style="color:#00F0FF; text-decoration:none; font-size:.9rem; display:inline-block; margin-bottom:20px;">← Bumalik sa Home</a>
        
        <h1 class="logo" style="font-size:1.8rem;"><span class="text-cyan">📝 TEXT TO SPEECH</span></h1>
        <p class="tagline">I-type ang teksto → gawing realistic AI voice</p>

        <div class="card">
            <div class="form-group">
                <label>I-type ang iyong teksto:</label>
                <textarea id="tts-text" placeholder="Hello! Ako ang AI voice mo..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Pumili ng Boses:</label>
                <select id="voice-select">
                    <option value="hpp4J3VqNfWAUOO0d1Us">Bella — Babae</option>
                    <option value="FGY2WhTYpPnrIDTdsKH5">Laura — Babae</option>
                    <option value="SAz9YHcvj6GT2YYXdXww">River — Babae</option>
                    <option value="cjVigY5qzO86Huf0OWal">Eric — Lalaki</option>
                    <option value="pqHfZKP75CvOlQylNhV4" selected>Bill — Lalaki</option>
                    <option value="pFZP5JQG7iQjIQuC4Bku">Lily — Babae</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">Sarah — Babae</option>
                    <option value="JBFqnCBsd6RMkjVDRZzb">George — Lalaki</option>
                </select>
            </div>
            
            <button id="generate-btn" class="btn-primary">🔊 GENERATE AUDIO</button>
            <p id="status" style="font-size:.85rem; color:#9CA3AF; margin-top:8px; text-align:center;"></p>
            
            <div id="tts-result" class="result-box hidden">
                <p id="result-message" class="success">✅ Tapos na!</p>
                <audio id="audio-player" controls>
            </div>
        </div>

        <footer>© 2026 DrewVoiceVerse</footer>
    </div>

    <script>
        const API_KEY = 'sk_ab07b8598b3586c17cdc0f64a6fa42211562290ae6432785';
        const API_BASE = 'https://api.elevenlabs.io/v1';

        const generateBtn = document.getElementById('generate-btn');
        const status = document.getElementById('status');
        const ttsResult = document.getElementById('tts-result');
        const resultMessage = document.getElementById('result-message');
        const audioPlayer = document.getElementById('audio-player');

        generateBtn.addEventListener('click', async () => {
            const text = document.getElementById('tts-text').value.trim();
            const voiceId = document.getElementById('voice-select').value;
            
            if (!text) { alert('⚠️ Mag-type muna ng teksto!'); return; }
            if (text.length > 5000) { alert('⚠️ Sobrang haba! Limit: 5000 characters'); return; }

            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading"></span>GENERATING...';
            status.textContent = '🔄 Kumokonekta sa ElevenLabs...';
            ttsResult.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: 'eleven_multilingual_v2',
                        voice_settings: {
                            stability: 0.5,
                            similarity_boost: 0.75
                        }
                    })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail?.message || `Error ${response.status}`);
                }

                const blob = await response.blob();
                audioPlayer.src = URL.createObjectURL(blob);
                resultMessage.className = 'success';
                resultMessage.textContent = '✅ Tapos na! Pakinggan 👇';
                ttsResult.classList.remove('hidden');
                status.textContent = '🎉 Handang-handa na!';

            } catch (err) {
                resultMessage.className = 'error';
                resultMessage.textContent = '❌ ' + err.message;
                ttsResult.classList.remove('hidden');
                status.textContent = '⚠️ May problema — tingnan ang API key at credits';
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '🔊 GENERATE AUDIO';
            }
        });
    </script>
</body>
</html>
